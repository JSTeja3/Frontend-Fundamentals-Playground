<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Fundamentals</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>JavaScript Fundamentals</h1>

    <section class="counter">
        <h2>Counter</h2>

        <div class="counter-controls">
            <button id="decrease">-</button>

            <span id="count">0</span>

            <button id="increase">+</button>
        </div>
    </section>

    <section class="theme-switcher">
        <h2>Theme Switcher</h2>

        <button id="themeButton">🌙 Dark Mode</button>
    </section>

    <section class="form-section">
        <h2>Registration Form</h2>

        <form id="registrationForm">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword">
            </div>

            <button type="submit">Submit</button>

        </form>

        <p id="formMessage"></p>
    </section>

    <section class="products">
        <h2>Product List</h2>
        <div class="customProducts">
            <input type="checkbox" id="containsInput">contains</input>
            <input type="text" id="searchInput" placeholder="Search products...">
            <button id="searchButton">Search</button>

            <label for="maxPrice">Maximum Price:</label>
            <input type="number" id="maxPrice" placeholder="Enter maximum price">
            <button onclick="filterByPrice()">Filter</button>
            
            <label for="sortOrder">Price:</label>
            <select id="sortOrder">
                <option value="select"> - select -</option>
                <option value="asc">Low to High</option>
                <option value="desc">High to Low</option>
            </select>
            <button onclick="sortProducts()">Sort</button>

            <input type="text" id="findByName" placeholder="Find products...">
            <button onclick="findProductsName()">Find by Name</button>

            <input type="text" id="productName" placeholder="Name">
            <input type="number" id="productPrice" placeholder="Price">
            <button onclick="addProduct()">Add Product</button>
            
        </div>

        <div id="productList"></div>
    </section>

    <script src="script.js"></script>
</body>

</html>
